apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock
  namespace: inventory
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stock
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: stock
    spec:
      containers:
        - name: stock
          image: inventory-system-stock:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: inventory-secret
            - configMapRef:
                name: inventory-config
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: stock
  namespace: inventory
spec:
  selector:
    app: stock
  ports:
    - port: 8000
      targetPort: 8000
