
apiVersion: v1
kind: Secret
metadata:
  name: inventory-secret
  namespace: inventory
type: Opaque
stringData:
  POSTGRES_DB: inventory
  POSTGRES_USER: inventory
  POSTGRES_PASSWORD: REPLACE_WITH_DATABASE_PASSWORD
  DATABASE_URL: postgresql+psycopg2://inventory:REPLACE_WITH_DATABASE_PASSWORD@postgres:5432/inventory
  JWT_SECRET: REPLACE_WITH_RANDOM_JWT_SECRET
  ADMIN_USERNAME: REPLACE_WITH_ADMIN_USERNAME
  ADMIN_PASSWORD: REPLACE_WITH_ADMIN_PASSWORD
