server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same service names work in Docker Compose and in Kubernetes
    location /api/auth/     { proxy_pass http://auth:8000; }
    location /api/products  { proxy_pass http://products:8000; }
    location /api/stock/    { proxy_pass http://stock:8000; }
}
